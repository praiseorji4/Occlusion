# Shared defaults inherited by every experiment. Override in dataset/model/experiment configs.
imgsz: 640
seed: 42
amp: true
patience: 20
workers: 8
optimizer: SGD

hsv_h: 0.015
translate: 0.1
fliplr: 0.5
flipud: 0.0
mixup: 0.0
degrees: 0.0

checkpoint_metric: AP_hard

aug_strategy: none
aug_p: 0.0
label_aware: false

fusion_type: none
fusion_scale: P4
use_fem: false
use_popam: false
use_visibility_head: false
lambda_vis: 0.5
lambda_occ_consistency: 0.1

mode: local
