[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "occlusion"
version = "0.1.0"
description = "Occlusion-robust pedestrian detection: label-aware augmentation, RGB-D fusion, and visibility supervision."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sikirulahi" }]
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "ultralytics==8.3.39",
    "timm==0.9.16",
    "numpy==1.26.4",
    "opencv-python==4.9.0.80",
    "Pillow==10.3.0",
    "scipy==1.13.0",
    "scikit-learn==1.4.2",
    "wandb==0.16.6",
    "matplotlib==3.8.4",
    "seaborn==0.13.2",
    "PyYAML==6.0.1",
    "tqdm==4.66.2",
    "pandas==2.2.1",
]

[project.optional-dependencies]
dev = ["pytest==8.2.0", "pytest-cov==5.0.0"]

[tool.setuptools.packages.find]
include = ["occlusion*"]
exclude = ["tests*", "notebooks*", "data*", "results*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
