      - Building: guides/building.md
      - Running: guides/running.md
      - Calibration: guides/calibration.md
      - Tuning: guides/tuning.md
      - Troubleshooting: guides/troubleshooting.md
  - Experiments:
      - Overview: experiments/overview.md
      - Logging: experiments/logging.md
  - Research:
      - Overview: research/overview.md
      - Gaps: research/gaps.md
      - Directions: research/directions.md
      - Reading List: research/reading_list.md
