# The trial matrix: what gets compared against what.
#
# 2x2 factorial over the two navigation improvements, plus two references and a
# negative control. Every arm must produce the SAME set of pair_keys
# (world/course/trial) so the paired bootstrap has something to pair.
#
# DEFAULTS MUST PRESERVE TODAY'S BEHAVIOUR. `mono_baseline` is the stack exactly
# as it ships, so an improvement that changes nothing shows as zero rather than
# as noise against a moved baseline.

schema_version: 1

arms:

  mono_baseline:
    description: Camera-only navigation as it ships today. The reference for A and B.
    launch: ubot_mono_nav/sim_mono.launch.py
    params: {}

  mono_A:
    description: >
      Blind-spot safety. Obstacles persist briefly after leaving the 65 deg view,
      which is also what makes Spin safe enough to restore: obstacles seen before
      the spin are still in the costmap during it. BackUp stays removed
      unconditionally - persistence cannot conjure a rear sensor.
    launch: ubot_mono_nav/sim_mono.launch.py
    params:
      local_costmap.local_costmap.ros__parameters.mono_scan.observation_persistence: 3.0
      global_costmap.global_costmap.ros__parameters.mono_scan.observation_persistence: 8.0
      behavior_server.ros__parameters.max_rotational_vel: 0.25
      bt_navigator.ros__parameters.default_nav_to_pose_bt_xml: navigate_to_pose_mono_A.xml

  mono_B:
    description: >
      Phantom-obstacle rejection in scan_geometry: more agreeing returns per bin,
      temporal agreement across frames, and gates on texture and glare. Targets
      2604.03096's documented failure mode.
    launch: ubot_mono_nav/sim_mono.launch.py
    params:
      depth_to_scan.ros__parameters.min_points: 8
      depth_to_scan.ros__parameters.temporal_window: 3
      depth_to_scan.ros__parameters.temporal_min_hits: 2
      depth_to_scan.ros__parameters.temporal_tol_m: 0.25
      depth_to_scan.ros__parameters.validity_gate: texture
      depth_to_scan.ros__parameters.glare_max_luma: 245
      depth_to_scan.ros__parameters.trusted_range: 3.5

  mono_AB:
    description: Both improvements. The arm the real-robot validation runs.
    launch: ubot_mono_nav/sim_mono.launch.py
    inherits: [mono_A, mono_B]

  lidar_ref:
    description: >
      The paired control group - the same course, the same goals, the MS200
      lidar stack untouched. Only arXiv 2604.03096 among the surveyed works does
      this, and it is half of what makes the result defensible.
    launch: ubot_bringup/sim.launch.py
    params:
      use_slam: false          # odom frame only, same as the mono arms
    notes: Uses /scan and nav2_params.yaml; nothing in ubot_mono_nav runs.

  mono_baseline_dup:
    description: >
      NEGATIVE CONTROL. The baseline under a second name. Its delta against
      mono_baseline must have a confidence interval spanning zero; if it does
      not, the harness has an arm-correlated artefact and every other number in
      the campaign is suspect. Cheapest insurance in the design - report it.
    launch: ubot_mono_nav/sim_mono.launch.py
    params: {}

# Arms whose deltas are the headline results, in the order the paper reports them.
comparisons:
  - [mono_baseline, mono_A]
  - [mono_baseline, mono_B]
  - [mono_baseline, mono_AB]
  - [mono_baseline, lidar_ref]
  - [mono_baseline, mono_baseline_dup]   # must span zero
