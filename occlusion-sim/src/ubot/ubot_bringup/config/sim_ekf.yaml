ekf_filter_node:
  ros__parameters:

    use_sim_time: true
    frequency: 50.0
    two_d_mode: true

    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    publish_tf: true

    # Wheel odometry: fuse x, y, yaw (pose) + vx, vy, vyaw (velocity)
    odom0: /diff_drive_controller/odom
    odom0_config: [true,  false, false,   # x only, not y
                  false, false, true,    # yaw only
                  true,  false, false,   # vx only
                  false, false, true,    # vyaw only
                  false, false, false]
    odom0_differential: false
    odom0_relative: false

    # IMU: fuse yaw orientation + angular velocity z only
    # Avoids noisy linear accelerations in 2D mode
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
