controller_manager:
  ros__parameters:
    update_rate: 50  # Hz
    use_sim_time: true

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

diff_drive_controller:
  ros__parameters:
    # Front wheels only — matches the real robot, where only the front motors are
    # commanded and only they carry encoders. The rear wheels are passive followers.
    left_wheel_names: ["front_left_wheel_joint"]
    right_wheel_names: ["front_right_wheel_joint"]

    # MEASURED IN THIS SIM, not copied from the robot. Commanding 0.6 rad/s and timing
    # the yaw against Gazebo ground truth gives an effective separation of 0.2504 m
    # (ratio 1.00), i.e. the sim turns almost exactly as the geometry predicts.
    #
    # The REAL robot needs 0.55 - it scrubs more than twice as hard - and the sim cannot
    # reproduce that. A friction sweep found no middle ground: mu2 0.50 and 0.90 both give
    # S_eff 0.250, and by 1.05 the wheels lock completely and the robot will not turn at
    # all. The real limit is TORQUE (the motors stall in a spin), which a velocity-commanded
    # joint in gz_ros2_control does not have. Reproducing it properly means modelling the
    # motor's effort limit, not raising friction.
    #
    # So: this value keeps sim ODOMETRY honest about sim PHYSICS, and the angular cap below
    # keeps anything tuned here executable on the robot. Do not "sync" it to 0.55.
    wheel_separation: 0.2504
    wheel_radius: 0.0325   # wheel_radius (Inspection Robot 01 CAD)

    # Odometry settings
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_footprint
    enable_odom_tf: false


    # Add these to prevent resets
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.03]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.03]
    open_loop: false

    # Constraints for smooth movement
    linear:
      x:
        has_velocity_limits: true
        max_velocity: 1.0
        min_velocity: -1.0
    angular:
      z:
        has_velocity_limits: true
        # The robot saturates at ~0.3 rad/s in a spin (tyre scrub + motor torque), so
        # anything faster is only achievable in simulation. Capped here so behaviour
        # developed in sim can actually be executed on the hardware.
        max_velocity: 0.3
        min_velocity: -0.3

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true
    # ADD THESE NEW LINES BELOW:
    qos_overrides:
      /joint_states:
        publisher:
          durability: volatile
          reliability: reliable

          
imu_sensor_broadcaster:
  ros__parameters:
    frame_id: imu_link
    sensor_name: imu_sensor
    