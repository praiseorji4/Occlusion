ekf_filter_node:
  ros__parameters:

    use_sim_time: false
    frequency: 30.0
    two_d_mode: true

    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    publish_tf: true

    # Wheel odometry: fuse x, yaw (pose) + vx, vyaw (velocity)
    odom0: /diff_drive_controller/odom
    # SAME FIX AS sim_ekf.yaml, which carries the full explanation: y was never
    # fused, so it was dead-reckoned from vx*sin(yaw) with no correction and
    # drifted without bound. In simulation that produced a 6 m jump in one
    # sample and an aborted episode. On the real robot the same configuration
    # would drift laterally too, with no ground truth to notice it - worth
    # re-checking against a tape measure after a long straight run.
    odom0_config: [true,  true,  false,
                   false, false, true,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false

    # IMU: fuse yaw angular velocity only
    imu0: /bno055/imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
