ekf_filter_node:
  ros__parameters:

    use_sim_time: false
    frequency: 30.0
    two_d_mode: true

    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    publish_tf: true

    # Wheel odometry: fuse x, yaw (pose) + vx, vyaw (velocity)
    odom0: /diff_drive_controller/odom
    odom0_config: [true,  false, false,
                   false, false, true,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false

    # IMU: fuse yaw angular velocity only
    imu0: /bno055/imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
